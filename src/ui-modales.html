<!-- Toast -->
<div id="toast"></div>

<!-- Modal de confirmación personalizado -->
<div class="modal-overlay hidden" id="confirm-overlay" style="z-index:400">
  <div class="confirm-modal">
    <div class="confirm-head">
      <div class="confirm-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h3 class="confirm-title" id="confirm-title">Atención</h3>
    </div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button type="button" class="confirm-btn-cancel" id="confirm-btn-cancel">Cancelar</button>
      <button type="button" class="confirm-btn-ok" id="confirm-btn-ok">Continuar</button>
    </div>
  </div>
</div>

<!-- Panel lateral: opciones de exportación de Reportes -->
<div id="rep-export-drawer-overlay" class="rep-drawer-overlay" onclick="closeRepExportDrawer()"></div>
<div id="rep-export-drawer" class="rep-drawer" role="dialog" aria-label="Opciones de exportación">
  <div class="rep-drawer-header">
    <div class="rep-drawer-title">Exportar reporte</div>
    <button type="button" class="rep-drawer-close" onclick="closeRepExportDrawer()" aria-label="Cerrar">&times;</button>
  </div>
  <div class="rep-drawer-body">
    <div class="rep-drawer-section-label">
      <span>Secciones a incluir</span>
      <button type="button" class="rep-drawer-all-btn" onclick="repDrawerSelectAll()">Todo</button>
    </div>
    <div class="rep-drawer-checks">
      <label class="rep-drawer-check"><input type="checkbox" id="rep-sec-clientes" checked><span>Clientes</span></label>
      <label class="rep-drawer-check"><input type="checkbox" id="rep-sec-vendedores" checked><span>Vendedores</span></label>
      <label class="rep-drawer-check"><input type="checkbox" id="rep-sec-marcas" checked><span>Marcas</span></label>
      <label class="rep-drawer-check"><input type="checkbox" id="rep-sec-ciudades" checked><span>Ciudad</span></label>
      <label class="rep-drawer-check"><input type="checkbox" id="rep-sec-zonas" checked><span>Zona</span></label>
    </div>
    <label class="rep-breakdown-toggle rep-drawer-breakdown" title="Incluir desglose por marca en cada sección">
      <input type="checkbox" id="rep-include-breakdown">
      <span>Desglose</span>
    </label>
    <div class="rep-drawer-actions">
      <button class="btn-refresh" onclick="exportReportPDF()" title="Descargar PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <polyline points="9 15 12 18 15 15"/>
        </svg>
        <span>Descargar PDF</span>
      </button>
      <button class="btn-refresh" onclick="exportReportCSV()" title="Descargar Excel (CSV)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Descargar Excel</span>
      </button>
    </div>
  </div>
</div>

<!-- Visor fullscreen de foto del pedido -->
<div id="photo-viewer-overlay" onclick="closePhotoViewer(event)">
  <button id="photo-viewer-close" type="button" onclick="closePhotoViewer()" aria-label="Cerrar">&times;</button>
  <img id="photo-viewer-img" src="" alt="Vista ampliada" draggable="false" ondragstart="return false">
  <div id="zoom-hint">Doble toque o rueda del mouse para zoom</div>
</div>

<!-- View Order Modal (read-only) -->
<div class="modal-overlay hidden" id="modal-view-overlay">
  <div class="modal view-modal" style="max-width:560px">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Ver Pedido</h2>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" id="view-prev-btn" class="view-nav-btn" onclick="navigateView(-1)" title="Pedido anterior" aria-label="Pedido anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span id="view-nav-pos" style="font-size:0.72rem;color:var(--gray-500);font-family:monospace;min-width:48px;text-align:center"></span>
        <button type="button" id="view-next-btn" class="view-nav-btn" onclick="navigateView(1)" title="Pedido siguiente" aria-label="Pedido siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span id="view-record-id" style="font-size:0.75rem;color:var(--gray-400);font-family:monospace;margin-left:6px"></span>
      </div>
    </div>
    <div class="view-body">
      <div>
        <div class="view-photo-wrap" id="v-photo-wrap" style="display:none">
          <div class="view-photo-label">Foto del pedido</div>
          <img id="v-photo-thumb" alt="Foto del pedido" onclick="openPhotoViewer(this.src)">
        </div>
        <div class="view-photo-empty" id="v-photo-empty" style="display:none">Sin foto del pedido</div>
      </div>
      <div class="view-fields-grid">
        <div class="form-group"><label>Cliente <span id="v-cliente-codigo-badge" style="display:none"></span></label><div class="view-field" id="v-cliente"></div></div>
        <div class="form-group"><label>Usuario</label><div class="view-field" id="v-usuario"></div></div>
        <div class="form-group"><label>N° Orden</label><div class="view-field" id="v-nroOrden"></div></div>
        <div class="form-group"><label>Fecha</label><div class="view-field" id="v-nroPedido"></div></div>
        <div class="form-group"><label>Entrega</label><div class="view-field" id="v-entrega"></div></div>
        <div class="form-group"><label>Ciudad</label><div class="view-field" id="v-ciudad"></div></div>
        <div class="form-group"><label>Zona</label><div class="view-field" id="v-zona"></div></div>
        <div class="form-group" style="grid-column:1/-1"><label>Dirección</label><div class="view-field" id="v-direccion"></div></div>
        <div class="form-group"><label>Forma de Pago</label><div class="view-field" id="v-formaPago"></div></div>
        <div class="form-group"><label>Tipo</label><div class="view-field" id="v-tipo"></div></div>
        <div class="form-group"><label>Marca</label><div class="view-field" id="v-marca"></div></div>
        <div class="form-group"><label>Total Pares</label><div class="view-field" id="v-totalPares"></div></div>
        <div class="form-group"><label>Total Precio</label><div class="view-field" id="v-totalPrecio"></div></div>
        <div class="form-group" style="grid-column:1/-1"><label>Observaciones</label><div class="view-field" id="v-obs"></div></div>
      </div>
    </div>
    <div class="modal-actions modal-actions--split">
      <div class="modal-actions-left">
        <button class="btn-modal-delete" id="btn-view-delete" onclick="deleteCurrentOrder()" style="display:none">Borrar</button>
      </div>
      <div class="modal-actions-right">
        <button class="btn-modal-cancel" onclick="closeViewModal()">Cerrar</button>
        <button class="btn-modal-save btn-modal-save--auto" id="btn-view-edit" onclick="switchViewToEdit()" style="display:none">Editar</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Order Modal -->
<div class="modal-overlay hidden" id="modal-edit-overlay">
  <div class="modal" style="max-width:560px">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2>Editar Pedido</h2>
      <span id="edit-record-id" style="font-size:0.75rem;color:var(--gray-400);font-family:monospace"></span>
    </div>
    <div class="edit-photo-section">
      <div class="edit-photo-thumb-wrap">
        <img id="e-photo-thumb" alt="Foto del pedido">
        <div class="edit-photo-empty" id="e-photo-empty" style="display:none">Sin foto</div>
        <div class="edit-photo-spinner" id="e-photo-spinner" style="display:none"><div class="spinner"></div></div>
      </div>
      <div class="edit-photo-actions">
        <button type="button" class="btn-photo-change" onclick="document.getElementById('e-photo-input').click()">Cambiar foto</button>
        <button type="button" class="btn-photo-cancel" id="e-photo-cancel" onclick="cancelEditPhotoChange()" style="display:none">Descartar nueva foto</button>
        <span id="e-photo-status"></span>
      </div>
      <input type="file" id="e-photo-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,.heic,.heif,.avif" onchange="handleEditPhotoSelect(event)" hidden>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group" style="position:relative">
        <label>Cliente <span style="color:var(--error)">*</span><span id="e-cliente-codigo-badge" style="display:none"></span></label>
        <input type="text" id="e-cliente" placeholder="Buscar por código, razón social o fantasía" autocomplete="off">
        <div id="e-cliente-suggestions" class="autocomplete-list" style="display:none"></div>
      </div>
      <div class="form-group"><label>N° Orden <span style="color:var(--error)">*</span></label><input type="text" id="e-nroOrden" inputmode="numeric"></div>
      <div class="form-group"><label>Fecha</label><input type="text" id="e-nroPedido" oninput="this.value=stripAccents(this.value)"></div>
      <div class="form-group"><label>Entrega</label><input type="text" id="e-entrega" oninput="this.value=stripAccents(this.value)"></div>
      <div class="form-group"><label>Ciudad</label><input type="text" id="e-ciudad" class="upper" readonly placeholder="Se completa al elegir el cliente"></div>
      <div class="form-group" style="grid-column:1/-1"><label>Dirección</label><input type="text" id="e-direccion" class="upper" oninput="this.value=stripAccents(this.value).toUpperCase()"></div>
      <div class="form-group"><label>Forma de Pago</label><input type="text" id="e-formaPago" oninput="this.value=stripAccents(this.value)"></div>
      <div class="form-group"><label>Tipo <span style="color:var(--error)">*</span></label><select id="e-tipo"><option value=""></option><option value="SHOW ROOM">SHOW ROOM</option><option value="STOCK">STOCK</option><option value="MALETEO">MALETEO</option></select></div>
      <div class="form-group"><label>Marca <span style="color:var(--error)">*</span></label><input type="text" id="e-marca" class="upper" oninput="this.value=normalizeMarca(this.value)"></div>
      <div class="form-group"><label>Total Pares <span style="color:var(--error)">*</span></label><input type="text" id="e-totalPares" inputmode="numeric"></div>
      <div class="form-group"><label>Total Precio <span style="color:var(--error)">*</span></label><input type="text" id="e-totalPrecio" inputmode="numeric" oninput="formatAmountInput(this)"></div>
      <div class="form-group" style="grid-column:1/-1"><label>Observaciones</label><input type="text" id="e-obs" oninput="this.value=stripAccents(this.value)"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeEditModal()">Cancelar</button>
      <button class="btn-modal-save" id="btn-edit-save" onclick="saveEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- User Modal (create / edit) -->
<div class="modal-overlay hidden" id="modal-user-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-handle"></div>
    <div style="margin-bottom:20px">
      <h2 id="user-modal-title">Nuevo Usuario</h2>
    </div>
    <label class="modal-label">Usuario</label>
    <input type="text" id="u-username" autocomplete="off" autocapitalize="none">
    <label class="modal-label" id="u-password-label">Contraseña</label>
    <input type="password" id="u-password" autocomplete="new-password">
    <label class="modal-label">Rol</label>
    <select id="u-rol">
      <option value="User">User — solo carga sus propios pedidos</option>
      <option value="AdminL">AdminL — ve todo, no edita ni borra</option>
      <option value="Admin">Admin — acceso completo</option>
    </select>
    <div id="u-activo-group" style="display:none">
      <label class="modal-label">Estado</label>
      <select id="u-activo">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeUserModal()">Cancelar</button>
      <button class="btn-modal-save" id="btn-user-save" onclick="saveUser()">Guardar</button>
    </div>
  </div>
</div>

<!-- Cliente View Modal (detalle) -->
<div class="modal-overlay hidden" id="modal-view-cliente-overlay">
  <div class="modal view-modal" style="max-width:560px">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Ver Cliente</h2>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" id="view-cliente-prev-btn" class="view-nav-btn" onclick="navigateClienteView(-1)" title="Cliente anterior" aria-label="Cliente anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span id="view-cliente-nav-pos" style="font-size:0.72rem;color:var(--gray-500);font-family:monospace;min-width:48px;text-align:center"></span>
        <button type="button" id="view-cliente-next-btn" class="view-nav-btn" onclick="navigateClienteView(1)" title="Cliente siguiente" aria-label="Cliente siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
    <div class="view-body cliente-view-body">
      <div class="cliente-fields-col">
        <div class="view-fields-grid">
          <div class="form-group"><label>Código</label><div class="view-field" id="vc-codigo"></div></div>
          <div class="form-group"><label>Razón Social</label><div class="view-field" id="vc-razon"></div></div>
          <div class="form-group" data-span="full"><label>Nombre Fantasía</label><div class="view-field" id="vc-fantasia"></div></div>
          <div class="form-group"><label>Ciudad</label><div class="view-field" id="vc-ciudad"></div></div>
          <div class="form-group"><label>Zona</label><div class="view-field" id="vc-zona"></div></div>
        </div>
      </div>

      <div class="cliente-stats-col">
        <div class="kpi-row">
          <div class="kpi-card"><div class="kpi-label">Pedidos</div><div class="kpi-value" id="vc-stat-count">0</div></div>
          <div class="kpi-card"><div class="kpi-label">Total Pares</div><div class="kpi-value" id="vc-stat-pares">0</div></div>
          <div class="kpi-card"><div class="kpi-label">Total Monto</div><div class="kpi-value" id="vc-stat-monto">0</div></div>
          <div class="kpi-card" id="vc-kpi-global" style="display:none;border-left-color:var(--gray-400)">
            <div class="kpi-label">Total General</div>
            <div class="kpi-value" id="vc-stat-global-monto">Gs. 0</div>
          </div>
        </div>

        <div style="margin-top:16px">
          <div class="rep-section-title" style="margin-bottom:8px" id="vc-orders-title">Pedidos de este cliente</div>
          <div id="vc-orders-list" class="vc-orders-list"></div>
        </div>
      </div>
    </div>
    <div class="modal-actions modal-actions--split">
      <div class="modal-actions-left">
        <button class="btn-modal-delete" id="btn-view-cliente-delete" onclick="deleteCurrentCliente()" style="display:none">Borrar</button>
      </div>
      <div class="modal-actions-right">
        <button class="btn-modal-cancel" onclick="closeViewClienteModal()">Cerrar</button>
        <button class="btn-modal-save btn-modal-save--auto" id="btn-view-cliente-edit" onclick="switchClienteViewToEdit()" style="display:none">Editar</button>
      </div>
    </div>
  </div>
</div>
