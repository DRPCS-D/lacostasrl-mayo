    <!-- ── Panel: Nuevo Pedido ── -->
    <div class="tab-panel active" id="panel-nuevo">
      <div class="new-order-grid" id="order-grid">

        <!-- Foto -->
        <div class="order-photo-col"><div class="card">
          <div class="section-title">Foto del pedido</div>
          <div id="drop-zone"
               onclick="document.getElementById('file-input').click()"
               ondragover="handleDragOver(event)"
               ondragleave="handleDragLeave(event)"
               ondrop="handleDrop(event)">
            <div class="drop-placeholder" id="placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="#8A1B1A" stroke-width="1.5" width="48" height="48">
                <polyline points="16 16 12 12 8 16"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
              </svg>
              <p class="drop-text">Arrastrá la foto aquí</p>
              <p class="drop-types">JPG · PNG · WEBP · HEIC · AVIF · PDF</p>
              <p class="drop-sub">o hacé clic para seleccionar</p>
              <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,application/pdf,.heic,.heif,.avif" onchange="handleFileSelect(event)" hidden>
              <button type="button" class="btn-select-file" onclick="event.stopPropagation();document.getElementById('file-input').click()">
                Seleccionar archivo
              </button>
            </div>
            <img id="preview-img" style="display:none" alt="Preview del pedido" onclick="event.stopPropagation();openPhotoViewer(this.src)">
            <button type="button" id="btn-rotate" class="btn-rotate" style="display:none" onclick="event.stopPropagation();rotatePreviewCCW()" title="Rotar 90° antihorario" aria-label="Rotar 90° antihorario">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
            </button>
            <button type="button" id="btn-clear-photo" class="btn-clear-photo" style="display:none" onclick="event.stopPropagation();clearPhotoOnly()" title="Quitar foto y elegir otra" aria-label="Quitar foto">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div id="pdf-queue-indicator" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="q-text">Pedido 1 de 1</span>
            <button type="button" class="q-nav q-prev" onclick="prevQueuePage()">← Anterior</button>
            <button type="button" class="q-nav q-next" onclick="nextQueuePage()">Siguiente →</button>
          </div>
          <button class="btn-extract" id="btn-extract" onclick="extractData()" disabled>
            <svg id="extract-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><path d="M20 2v6h-6"/>
            </svg>
            <div class="spinner" id="spinner"></div>
            <span id="extract-label">Cargar</span>
          </button>
        </div></div>

        <!-- Formulario -->
        <div class="order-form-col"><div class="card">
          <div class="section-title">Datos del pedido</div>
          <div class="form-grid" id="form-grid">
            <div class="form-group" style="position:relative">
              <label>Cliente <span style="color:var(--error)">*</span><span id="cliente-codigo-badge" style="display:none"></span></label>
              <input type="text" id="f-cliente" placeholder="Buscar por código, razón social o fantasía" autocomplete="off">
              <div id="cliente-suggestions" class="autocomplete-list" style="display:none"></div>
            </div>
            <div class="form-group">
              <label>N° Orden <span style="color:var(--error)">*</span></label>
              <input type="text" id="f-nroOrden" inputmode="numeric">
            </div>
            <div class="form-group">
              <label>Fecha</label>
              <input type="text" id="f-nroPedido" oninput="this.value=stripAccents(this.value)">
            </div>
            <div class="form-group">
              <label>Entrega</label>
              <input type="text" id="f-entrega" oninput="this.value=stripAccents(this.value)">
            </div>
            <div class="form-group">
              <label>Ciudad</label>
              <input type="text" id="f-ciudad" class="upper" readonly placeholder="Se completa al elegir el cliente">
            </div>
            <div class="form-group full">
              <label>Dirección</label>
              <input type="text" id="f-direccion" class="upper" oninput="this.value=stripAccents(this.value).toUpperCase()">
            </div>
            <div class="form-group">
              <label>Forma de Pago</label>
              <input type="text" id="f-formaPago" oninput="this.value=stripAccents(this.value)">
            </div>
            <div class="form-group">
              <label>Tipo <span style="color:var(--error)">*</span></label>
              <select id="f-tipo">
                <option value=""></option>
                <option value="SHOW ROOM">SHOW ROOM</option>
                <option value="STOCK">STOCK</option>
                <option value="MALETEO">MALETEO</option>
              </select>
            </div>
            <div class="form-group">
              <label>Marca <span style="color:var(--error)">*</span></label>
              <input type="text" id="f-marca" class="upper" oninput="this.value=normalizeMarca(this.value)">
            </div>
            <div class="form-group">
              <label>Total Pares <span style="color:var(--error)">*</span></label>
              <input type="text" id="f-totalPares" inputmode="numeric">
            </div>
            <div class="form-group">
              <label>Total Precio <span style="color:var(--error)">*</span></label>
              <input type="text" id="f-totalPrecio" inputmode="numeric" oninput="formatAmountInput(this)">
            </div>
            <div class="form-group full">
              <label>Observaciones</label>
              <input type="text" id="f-obs" placeholder="Notas adicionales del pedido" oninput="this.value=stripAccents(this.value)">
            </div>
          </div>
          <button class="btn-save" id="btn-save" onclick="saveOrder()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            <div class="spinner" id="save-spinner"></div>
            <span id="save-label">Guardar pedido</span>
          </button>
        </div></div>

      </div>
    </div>
