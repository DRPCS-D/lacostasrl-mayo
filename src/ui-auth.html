<!-- Loading -->
<div id="loading-screen">
  <div class="loading-logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
  </div>
  <div class="spinner" style="display:block;border-color:rgba(138,27,26,0.25);border-top-color:var(--primary);width:22px;height:22px"></div>
  <span class="loading-text">Cargando...</span>
</div>

<!-- Auth Screen -->
<div id="auth-screen">

  <!-- Setup: crear primer admin -->
  <div id="screen-setup" class="auth-card" style="display:none">
    <div class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    <div class="auth-title">LA COSTA S.R.L</div>
    <div class="auth-subtitle">Primera vez: creá la cuenta de administrador</div>
    <form id="setup-form" onsubmit="doSetup(event)" autocomplete="on">
      <div class="auth-form-group">
        <label for="setup-username">Usuario</label>
        <input type="text" id="setup-username" name="username" placeholder="ej: admin"
               autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="auth-form-group">
        <label for="setup-password">Contraseña</label>
        <input type="password" id="setup-password" name="password" placeholder="Mínimo 4 caracteres"
               autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-auth" id="btn-setup">Crear administrador</button>
    </form>
    <div class="auth-error" id="setup-error"></div>
  </div>

  <!-- Login -->
  <div id="screen-login" class="auth-card" style="display:none">
    <div class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    <div class="auth-title">LA COSTA S.R.L</div>
    <div class="auth-subtitle">Ingresá con tu usuario y contraseña</div>
    <form id="login-form" onsubmit="doLogin(event)" autocomplete="on">
      <div class="auth-form-group">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" name="username" placeholder="Tu usuario"
               autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="auth-form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" name="password" placeholder="Tu contraseña"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-auth" id="btn-login">Ingresar</button>
    </form>
    <div class="auth-error" id="login-error"></div>
  </div>

</div><!-- /auth-screen -->
