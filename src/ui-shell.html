  <!-- Header -->
  <header>
    <div style="display:flex;align-items:center;min-width:0;flex:1">
      <button class="btn-menu" onclick="openDrawer()" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="header-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
        <span>LA COSTA S.R.L</span>
        <span class="header-title-short">Pedidos La Costa</span>
      </div>
    </div>
  </header>

  <!-- Side Drawer -->
  <div id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside id="drawer">
    <div class="drawer-header">
      <button class="drawer-close" onclick="closeDrawer()" aria-label="Cerrar menú">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
      <div class="drawer-user-avatar" id="drawer-avatar">?</div>
      <div class="drawer-username" id="drawer-username">—</div>
      <span class="drawer-role" id="drawer-role">—</span>
    </div>
    <div class="drawer-body">
      <button class="drawer-item" id="drawer-pedidos" onclick="switchSection('pedidos')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Pedidos
      </button>
      <button class="drawer-item" id="drawer-clientes" onclick="switchSection('clientes')" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Clientes
      </button>
      <button class="drawer-item" id="drawer-usuarios" onclick="switchSection('usuarios')" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Usuarios
      </button>
      <button class="drawer-item" id="drawer-reportes" onclick="switchSection('reportes')" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 3v18h18"/>
          <path d="M7 14l4-4 4 4 5-7"/>
        </svg>
        Reportes
      </button>
      <div class="drawer-divider"></div>
      <button class="drawer-item danger" onclick="doLogout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Tab Bar (solo visible en sección Pedidos) -->
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" id="tab-nuevo" onclick="switchTab('nuevo')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Nuevo Pedido
    </button>
    <button class="tab-btn" id="tab-guardados" onclick="switchTab('guardados')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Pedidos
    </button>
  </div>
