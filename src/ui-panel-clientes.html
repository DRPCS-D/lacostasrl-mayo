    <!-- ── Panel: Clientes (Admin only) ── -->
    <div class="tab-panel" id="panel-clientes">
      <div class="card">
        <div class="records-toolbar">
          <div class="section-title" style="margin:0">Gestión de Clientes</div>
          <button class="btn-refresh" id="btn-new-cliente" onclick="openNewClienteModal()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nuevo cliente
          </button>
        </div>
        <div class="search-row">
          <div class="search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-clientes" placeholder="Buscar por código, razón social o fantasía..." oninput="renderClientes()">
          </div>
          <div class="filters-wrap">
            <button class="btn-filters" id="btn-filters-clientes" onclick="toggleClienteFiltersPanel(event)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              Filtros
              <span class="filters-count" id="filters-count-clientes" style="display:none">0</span>
            </button>
            <div class="filters-panel" id="filters-panel-clientes" hidden>
              <div class="filters-grid">
                <div class="sdrop" data-key="Ciudad">
                  <button class="sdrop-toggle" type="button" onclick="toggleSdrop(this)">
                    <span class="sdrop-label">Todas las ciudades</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                  </button>
                  <div class="sdrop-panel" hidden>
                    <input type="text" class="sdrop-search" placeholder="Buscar ciudad..." oninput="filterSdropOptions(this)">
                    <div class="sdrop-options"></div>
                  </div>
                  <input type="hidden" id="filter-cliente-ciudad" value="">
                </div>
                <div class="sdrop" data-key="Zona">
                  <button class="sdrop-toggle" type="button" onclick="toggleSdrop(this)">
                    <span class="sdrop-label">Todas las zonas</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                  </button>
                  <div class="sdrop-panel" hidden>
                    <input type="text" class="sdrop-search" placeholder="Buscar zona..." oninput="filterSdropOptions(this)">
                    <div class="sdrop-options"></div>
                  </div>
                  <input type="hidden" id="filter-cliente-zona" value="">
                </div>
              </div>
              <button class="btn-clear-filters" type="button" onclick="clearClienteFilters()">Limpiar filtros</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table style="min-width:500px">
            <thead>
              <tr>
                <th>Código</th>
                <th>Razón Social</th>
                <th>Nombre Fantasía</th>
                <th>Ciudad</th>
                <th>Zona</th>
              </tr>
            </thead>
            <tbody id="clientes-body">
              <tr><td colspan="5" class="empty-table">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
