  <script>
    // Marca el body como mobile y aplica layout vertical para Nuevo Pedido.
    // NOTA: ya NO usamos el hack de `zoom` CSS porque rompe el file picker en Android Brave.
    // Con `addMetaTag('viewport', ...)` en el doGet del Code.gs ya alcanza para mobile.
    (function() {
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (!isMobile) return;
      var css = '#order-grid{flex-direction:column!important}'
              + '.order-photo-col,.order-form-col{flex:1 1 100%!important;width:100%!important;min-width:0!important}';
      var s = document.createElement('style');
      s.textContent = css;
      document.head.appendChild(s);
      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.add('is-mobile');
      });
    })();
  </script>
